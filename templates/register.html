<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Crear cuenta · BrainSuplementos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;}
  *{box-sizing:border-box;}
  body{
    font-family:'Poppins','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;
    background:#eef2f9; display:flex; align-items:center; justify-content:center;
    min-height:100vh; margin:0; padding:24px;
  }
  .box{background:#fff;padding:36px 32px;border-radius:14px;box-shadow:0 6px 20px rgba(12,32,60,0.10);width:100%;max-width:380px;}
  .logo{display:block;text-align:center;margin-bottom:22px;text-decoration:none;}
  h1{font-weight:600;font-size:1.35rem;margin:0 0 4px;color:#0f2645;text-align:center;}
  p.sub{color:#5f6b80;font-size:0.86rem;margin:0 0 20px;text-align:center;}
  label{display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;color:#0f2645;}
  input{width:100%;padding:12px 14px;border:1.5px solid #dbe3ef;border-radius:8px;font-size:0.95rem;margin-bottom:16px;background:#fff;color:#0f2645;}
  input:focus{outline:none;border-color:#0c4187;}
  button.submit{width:100%;padding:12px;border:none;border-radius:24px;background:#0c4187;color:#fff;font-weight:600;cursor:pointer;font-size:0.95rem;}
  button.submit:hover{background:#0a3468;}
  .flash{background:#fdf0d5;border:1px solid #eac97e;color:#7a5c14;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:0.85rem;}
  .switch{display:block;text-align:center;margin-top:18px;font-size:0.85rem;color:#5f6b80;}
  .switch a{color:#0c4187;font-weight:600;text-decoration:none;}
  .switch a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="box">
    <a href="/" class="logo"><img src="/static/img/logo-brain.png" alt="BrainSuplementos" style="height:40px;width:auto;border-radius:6px;"></a>
    <h1>Creá tu cuenta</h1>
    <p class="sub">La necesitás para poder comprar en la tienda</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Nombre y apellido</label>
      <input type="text" name="name" required autofocus>
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Teléfono (opcional)</label>
      <input type="tel" name="phone" placeholder="Ej: 1123456789">
      <label>Contraseña</label>
      <input type="password" name="password" required minlength="6">
      <label>Repetir contraseña</label>
      <input type="password" name="password2" required minlength="6">
      <button type="submit" class="submit">Crear cuenta</button>
    </form>
    <span class="switch">¿Ya tenés cuenta? <a href="/login?next={{ next }}">Iniciá sesión</a></span>
  </div>
</body>
</html>
