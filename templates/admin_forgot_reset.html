<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Nueva contraseña · Panel admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;}
  body{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;background:#eef2f9;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
  .box{background:#fff;padding:36px 32px;border-radius:14px;box-shadow:0 6px 20px rgba(12,32,60,0.10);width:100%;max-width:340px;}
  h1{font-family:'Poppins','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;font-weight:600;font-size:1.3rem;margin:0 0 4px;color:#0f2645;}
  p{color:#5f6b80;font-size:0.88rem;margin:0 0 20px;}
  label{display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;color:#0f2645;}
  input{width:100%;padding:12px 14px;border:1.5px solid #dbe3ef;border-radius:8px;font-size:0.95rem;margin-bottom:16px;box-sizing:border-box;background:#fff;color:#0f2645;}
  button{width:100%;padding:12px;border:none;border-radius:24px;background:#0c4187;color:#fff;font-weight:600;cursor:pointer;font-size:0.95rem;}
  button:hover{background:#0a3468;}
  .flash{background:#fdf0d5;border:1px solid #eac97e;color:#7a5c14;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:0.85rem;}
</style>
</head>
<body>
  <form class="box" method="post">
    <h1>Nueva contraseña</h1>
    <p>Elegí tu nueva contraseña para entrar al panel.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <label>Contraseña nueva (mínimo 6 caracteres)</label>
    <input type="password" name="password" required minlength="6" autofocus>
    <label>Repetir contraseña</label>
    <input type="password" name="password2" required minlength="6">
    <button type="submit">Guardar contraseña</button>
  </form>
</body>
</html>
